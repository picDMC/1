<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#764ba2">
<title>Bốc thăm đội lượm banh Pickleball DMC :D</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    min-height: 100dvh; /* fit chính xác trên mobile, tránh bị thanh URL che */
    margin: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: max(20px, env(safe-area-inset-top)) max(20px, env(safe-area-inset-right)) max(20px, env(safe-area-inset-bottom)) max(20px, env(safe-area-inset-left));
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: clamp(20px, 5vw, 32px);
    max-width: 480px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
  }
  h1 {
    font-size: clamp(18px, 5vw, 22px);
    margin: 0 0 20px;
    color: #333;
    text-align: center;
  }
  textarea {
    width: 100%;
    min-height: 70px;
    padding: 12px;
    border: 2px solid #ddd;
    border-radius: 10px;
    font-size: 16px; /* >=16px để iOS không tự zoom khi focus */
    resize: vertical;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
  }
  textarea:focus { outline: none; border-color: #764ba2; }
  button {
    width: 100%;
    margin-top: 16px;
    padding: 16px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 16px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation; /* bấm nhanh, không delay 300ms trên mobile */
  }
  button:active { transform: scale(0.98); }
  button:hover { opacity: 0.9; }

  @media (max-width: 380px) {
    .card { padding: 18px; border-radius: 12px; }
    .name-item { font-size: 14px; padding: 9px 12px; }
  }
  #result {
    margin-top: 20px;
    min-height: 40px;
  }
  .name-item {
    display: flex;
    align-items: center;
    gap: 10px;
    background: #f5f4ff;
    border-radius: 8px;
    padding: 10px 14px;
    margin-bottom: 8px;
    font-size: 15px;
    color: #333;
    animation: fadeIn 0.35s ease both;
  }
  .num {
    background: #764ba2;
    color: #fff;
    width: 24px;
    height: 24px;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 13px;
    font-weight: 700;
    flex-shrink: 0;
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hint {
    font-size: 13px;
    color: #888;
    text-align: center;
    margin-top: 6px;
  }
</style>
</head>
<body>
  <div class="card">
    <h1>🎲 Bốc thăm đội lượm banh Pickleball DMC :D</h1>
    <textarea id="input" placeholder="Thanh.Nga. Dung. Huynh.Quang.Hoàng.Dũng">Thanh.Nga. Dung. Huynh.Quang.Hoàng.Dũng</textarea>
    <div class="hint">Nhập tên, cách nhau bởi dấu chấm (.)</div>
    <button onclick="shuffleNames()">🔀 Bấm chọn ngẫu nhiên</button>
    <div id="result"></div>
  </div>

<script>
function shuffleNames() {
  const raw = document.getElementById('input').value;
  let names = raw.split('.').map(n => n.trim()).filter(n => n.length > 0);

  if (names.length === 0) {
    document.getElementById('result').innerHTML =
      '<div class="name-item">⚠️ Vui lòng nhập ít nhất 1 tên.</div>';
    return;
  }

  // Fisher-Yates shuffle
  for (let i = names.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [names[i], names[j]] = [names[j], names[i]];
  }

  const resultDiv = document.getElementById('result');
  resultDiv.innerHTML = names.map((n, i) =>
    `<div class="name-item" style="animation-delay:${i * 0.06}s"><span class="num">${i + 1}</span>${n}</div>`
  ).join('');
}
</script>
</body>
</html>
