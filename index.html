<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#764ba2">
<link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
<link rel="icon" type="image/png" sizes="512x512" href="icon-512.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="manifest" href="manifest.json">
<meta name="apple-mobile-web-app-title" content="Bốc thăm Pic DMC">
<meta name="apple-mobile-web-app-capable" content="yes">
<title>APP BỐC THĂM</title>
<style>
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body {
    height: 100%;
    overscroll-behavior: none;
  }
  body {
    font-family: 'Segoe UI', system-ui, -apple-system, sans-serif;
    background: linear-gradient(135deg, #667eea, #764ba2);
    min-height: 100vh;
    min-height: 100dvh; /* fit chính xác trên mobile, tránh bị thanh URL che */
    margin: 0;
    display: flex;
    align-items: stretch;
    justify-content: center;
    padding: max(10px, env(safe-area-inset-top)) max(10px, env(safe-area-inset-right)) max(10px, env(safe-area-inset-bottom)) max(10px, env(safe-area-inset-left));
  }
  .card {
    background: #fff;
    border-radius: 16px;
    padding: clamp(10px, 2.5vw, 20px);
    max-width: 560px;
    width: 100%;
    box-shadow: 0 20px 50px rgba(0,0,0,0.25);
    display: flex;
    flex-direction: column;
    min-height: 0;
  }
  h1 {
    font-size: clamp(14px, 3.6vw, 18px);
    margin: 0 0 8px;
    color: #333;
    text-align: center;
    flex-shrink: 0;
  }
  textarea {
    width: 100%;
    min-height: 42px;
    padding: 8px 10px;
    border: 2px solid #ddd;
    border-radius: 8px;
    font-size: 16px; /* >=16px để iOS không tự zoom khi focus */
    resize: vertical;
    font-family: inherit;
    -webkit-appearance: none;
    appearance: none;
    flex-shrink: 0;
  }
  textarea:focus { outline: none; border-color: #764ba2; }
  button {
    width: 100%;
    margin-top: 8px;
    padding: 11px 6px;
    background: linear-gradient(135deg, #667eea, #764ba2);
    color: #fff;
    border: none;
    border-radius: 10px;
    font-size: 15px;
    font-weight: 600;
    cursor: pointer;
    transition: transform 0.1s, opacity 0.2s;
    -webkit-appearance: none;
    appearance: none;
    touch-action: manipulation; /* bấm nhanh, không delay 300ms trên mobile */
    flex-shrink: 0;
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  button:active { transform: scale(0.98); }
  button:hover { opacity: 0.9; }
  .btn-row {
    display: flex;
    gap: 6px;
    flex-shrink: 0;
  }
  .btn-row button {
    margin-top: 8px;
    flex: 1;
    min-width: 0;
    padding-left: 4px;
    padding-right: 4px;
    font-size: clamp(11px, 3.4vw, 15px);
  }
  .btn-secondary {
    background: #fff;
    color: #764ba2;
    border: 2px solid #764ba2;
    background-image: none;
  }
  .page {
    display: flex;
    flex-direction: column;
    flex: 1;
    min-height: 0;
  }
  .team-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr;
    gap: 8px;
    width: 100%;
    height: 100%;
    min-height: 0;
  }

  @media (max-width: 380px) {
    .card { padding: 8px; border-radius: 12px; }
    .hiep-grid { gap: 5px; }
    .hiep-block { padding: 4px 4px 3px; }
    .btn-row { gap: 4px; }
    .btn-row button { padding: 9px 2px; }
  }
  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(-6px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .hint {
    font-size: 11px;
    color: #888;
    text-align: center;
    margin-top: 3px;
    flex-shrink: 0;
  }
  #result, #teamResult {
    flex: 1;
    min-height: 0;
    display: flex;
    margin-top: 8px;
  }
  #result:empty, #teamResult:empty { display: none; margin-top: 0; }
  .hiep-grid {
    display: grid;
    grid-template-columns: 1fr 1fr;
    grid-template-rows: 1fr 1fr;
    gap: 8px;
    width: 100%;
    height: 100%;
    min-height: 0;
  }
  .hiep-block {
    background: #f7f6fd;
    border: 1px solid #ece9fb;
    border-radius: 10px;
    padding: 5px 5px 4px;
    display: flex;
    flex-direction: column;
    min-height: 0;
    overflow: hidden;
  }
  .hiep-title {
    font-size: clamp(11px, 2.6vh, 15px);
    font-weight: 700;
    color: #fff;
    background: linear-gradient(135deg, #667eea, #764ba2);
    border-radius: 6px;
    padding: 3px 4px;
    margin-bottom: 4px;
    text-align: center;
    flex-shrink: 0;
  }
  .name-list {
    flex: 1;
    min-height: 0;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    gap: 2px;
  }
  .mini-name {
    display: flex;
    align-items: center;
    gap: 4px;
    background: #fff;
    border-radius: 5px;
    padding: 0 6px;
    font-size: clamp(12px, 3.3vh, 21px);
    font-weight: 600;
    color: #333;
    line-height: 1.1;
    flex: 1;
    min-height: 0;
    animation: fadeIn 0.3s ease both;
    overflow: hidden;
    white-space: nowrap;
  }
  .mini-name span:last-child {
    overflow: hidden;
    text-overflow: ellipsis;
    white-space: nowrap;
  }
  .mini-num {
    background: #764ba2;
    color: #fff;
    width: 1.5em;
    height: 1.5em;
    min-width: 1.5em;
    border-radius: 50%;
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 0.65em;
    font-weight: 700;
    flex-shrink: 0;
  }
  .empty-hint {
    text-align: center;
    color: #aaa;
    font-size: 13px;
    padding: 6px 0;
    margin: auto;
  }
</style>
</head>
<body>
  <div class="card">

    <div class="page" id="page1">
      <h1>🎲 Bốc thăm đội lượm banh Pickleball DMC 🏓</h1>
      <textarea id="input" placeholder="Thanh.Nga. Dung. Huynh.Quang.Hoàng.Dũng">Thanh.Nga. Dung. Huynh.Quang.Hoàng.Dũng</textarea>
      <div class="hint">Nhập tên, cách nhau bởi dấu chấm (.)</div>
      <div class="btn-row">
        <button onclick="shuffleNames()">🔀 Chọn ngẫu nhiên</button>
        <button class="btn-secondary" onclick="goToPage2()">🔁 Đổi kiểu bốc</button>
      </div>
      <div id="result"></div>
    </div>

    <div class="page" id="page2" style="display:none;">
      <h1>⚔️ Chia 2 đội ngẫu nhiên</h1>
      <div class="btn-row">
        <button class="btn-secondary" onclick="goToPage1()">⬅️ Quay lại</button>
        <button onclick="divideTeams()">🔀 Chia đội</button>
      </div>
      <div id="teamResult"></div>
    </div>

  </div>

<script>
function shuffleArray(arr) {
  const a = [...arr];
  for (let i = a.length - 1; i > 0; i--) {
    const j = Math.floor(Math.random() * (i + 1));
    [a[i], a[j]] = [a[j], a[i]];
  }
  return a;
}

function getNames() {
  const raw = document.getElementById('input').value;
  return raw.split('.').map(n => n.trim()).filter(n => n.length > 0);
}

function shuffleNames() {
  const names = getNames();
  const resultDiv = document.getElementById('result');

  if (names.length === 0) {
    resultDiv.innerHTML = '<div class="empty-hint">⚠️ Vui lòng nhập ít nhất 1 tên.</div>';
    return;
  }

  const NUM_HIEP = 4;

  const gridHtml = Array.from({ length: NUM_HIEP }, (_, hIndex) => {
    const order = shuffleArray(names); // mỗi hiệp có đủ tất cả người, thứ tự ngẫu nhiên riêng
    const items = order.map((n, i) =>
      `<div class="mini-name" style="animation-delay:${i * 0.03}s"><span class="mini-num">${i + 1}</span><span>${n}</span></div>`
    ).join('');

    return `
      <div class="hiep-block">
        <div class="hiep-title">🏆 Hiệp ${hIndex + 1}</div>
        <div class="name-list">${items}</div>
      </div>`;
  }).join('');

  resultDiv.innerHTML = `<div class="hiep-grid">${gridHtml}</div>`;
}

function divideTeams() {
  const names = getNames();
  const teamResultDiv = document.getElementById('teamResult');

  if (names.length === 0) {
    teamResultDiv.innerHTML = '<div class="empty-hint">⚠️ Vui lòng quay lại nhập ít nhất 1 tên.</div>';
    return;
  }

  const shuffled = shuffleArray(names);
  const mid = Math.ceil(shuffled.length / 2);
  const team1 = shuffled.slice(0, mid);
  const team2 = shuffled.slice(mid);

  const renderTeam = (team, label) => {
    const items = team.map((n, i) =>
      `<div class="mini-name" style="animation-delay:${i * 0.03}s"><span class="mini-num">${i + 1}</span><span>${n}</span></div>`
    ).join('');
    return `
      <div class="hiep-block">
        <div class="hiep-title">${label}</div>
        <div class="name-list">${items}</div>
      </div>`;
  };

  teamResultDiv.innerHTML = `
    <div class="team-grid">
      ${renderTeam(team1, '🔵 Đội 1')}
      ${renderTeam(team2, '🔴 Đội 2')}
    </div>`;
}

function goToPage2() {
  document.getElementById('page1').style.display = 'none';
  document.getElementById('page2').style.display = 'flex';
}

function goToPage1() {
  document.getElementById('page2').style.display = 'none';
  document.getElementById('page1').style.display = 'flex';
}
</script>
</body>
</html>
